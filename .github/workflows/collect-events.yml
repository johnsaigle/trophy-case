name: Collect events

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run collector
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_READ_ONLY: ${{ secrets.PAT_READ_ONLY }}
        run: node scripts/collect.js

      - name: Open proposal PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet events.jsonl .github/collect-state.json; then
            echo "No changes to propose"
            exit 0
          fi

          BRANCH="collect/$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add events.jsonl .github/collect-state.json proposals/
          git commit -m "collect: propose new events for week of $(date +%Y-%m-%d)"
          git push origin "$BRANCH"

          COUNT=$(grep -c '"reviewed": false' events.jsonl || true)
          gh pr create \
            --title "collect: $(grep -c '"reviewed": false' events.jsonl) proposed events awaiting review" \
            --body "Weekly collector run. Proposed events carry \`reviewed: false\`. Review the \`events.jsonl\` diff — edit summaries/notability as needed, then merge to accept. Close to reject." \
            --head "$BRANCH"
