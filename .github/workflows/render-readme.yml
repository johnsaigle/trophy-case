name: Render README

on:
  push:
    branches:
      - main
    paths:
      - 'events.jsonl'
      - 'scripts/render.js'
      - 'scripts/backfill.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Render README
        run: node scripts/render.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: render README from events.jsonl"
            git push
          fi

      - name: Prune merged collect branches
        run: |
          git fetch origin '+refs/heads/collect/*:refs/remotes/origin/collect/*'
          for BR in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/collect/); do
            NAME="${BR#origin/}"
            if git merge-base --is-ancestor "$BR" HEAD 2>/dev/null; then
              echo "Deleting merged branch $NAME"
              git push origin --delete "$NAME" || echo "WARN: failed to delete $NAME"
            fi
          done
